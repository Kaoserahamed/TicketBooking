# Backend secrets — COMMITTED VALUES BELOW ARE DEVELOPMENT PLACEHOLDERS ONLY.
#
# Real deployments must replace this file with one of:
#   kubectl -n ticket-booking create secret generic tbs-backend-secrets \
#     --from-literal=DB_PASSWORD=... \
#     --from-literal=MYSQL_ROOT_PASSWORD=... \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=JWT_REFRESH_SECRET=$(openssl rand -hex 32) \
#     --dry-run=client -o yaml | kubectl apply -f -
# ...or an external secret manager (Sealed Secrets / External Secrets Operator).
#
# backend/src/config/env.js refuses the dev JWT secrets when NODE_ENV=production,
# so a cluster started with the placeholders below will fail fast on boot —
# that is by design (docs/11-security.md §11.2).
apiVersion: v1
kind: Secret
metadata:
  name: tbs-backend-secrets
  namespace: ticket-booking
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: ticket-booking
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE-ME-db-password"
  MYSQL_ROOT_PASSWORD: "CHANGE-ME-root-password"
  JWT_SECRET: "CHANGE-ME-generate-with-openssl-rand-hex-32"
  JWT_REFRESH_SECRET: "CHANGE-ME-generate-with-openssl-rand-hex-32"
