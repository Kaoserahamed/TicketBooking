# Backend API — Deployment + ClusterIP Service.
# The Service MUST be named `backend`: the frontend image's nginx proxies
# /api to http://backend:4000 (frontend/nginx.conf), which resolves this
# Service inside the namespace.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ticket-booking
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: ticket-booking
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ticket-booking
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: ticket-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: ticket-booking
    spec:
      # The API image already drops to the unprivileged `node` user
      # (backend/Dockerfile -> USER node, UID 1000). Declaring it here makes the
      # kubelet enforce it: runAsNonRoot alone cannot be verified against a
      # named user, so the numeric ID is pinned too.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # Give MySQL a head start on cold boot; retry loop keeps pods pending
      # rather than crash-looping while the DB initializes its schema.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "waiting for mysql..."; sleep 3
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: backend
          # Published by the CI pipeline (ghcr.io/<repo>/backend:latest).
          image: ghcr.io/kaoserahamed/ticketbooking/backend:latest
          imagePullPolicy: Always
          # The API only needs to listen on 4000, so it gets no Linux
          # capabilities and cannot gain any through a setuid binary.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: tbs-backend-config
            - secretRef:
                name: tbs-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            # /health/db checks the actual MySQL round-trip, so traffic only
            # reaches a pod that can really serve requests.
            httpGet:
              path: /health/db
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            # /health is process liveness only — it keeps answering even when
            # the DB is briefly unreachable, preventing restart storms.
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
