name: CI/CD

# Pipeline (docs/12-deployment.md):
#   1. backend — lockfile install, lint/format/typecheck, dependency audit,
#      then unit + integration tests against a real MySQL 8 service and a
#      coverage-gated unit pass
#   2. frontend — lockfile install, lint/format/typecheck, dependency audit,
#      coverage-gated vitest run, then the production build
#   3. sql      — recreate the schema on a real MySQL 8 service, then run the
#      whole tests/sql/ suite (seed data, booking flow, concurrency, workers)
#   4. manifests— render infrastructure/kubernetes with kustomize and validate
#      every object against the Kubernetes API schemas (kubeconform, strict)
#   5. images  — build both container images (and push to GHCR on main)
#
# Every job fails fast on lint, formatting, typecheck, coverage or audit
# errors, so a regression cannot reach main just because tests happened to pass.
#
# Docker builds also act as a second gate: the frontend image runs
# `tsc -b && vite build` again, so a broken main can never ship an image.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: ticket_booking_test
          MYSQL_USER: tbs_test
          MYSQL_PASSWORD: ci-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-db-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: tbs_test
      DB_PASSWORD: ci-db-password
      DB_NAME: ticket_booking_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Check formatting
        working-directory: backend
        run: npm run format:check

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Dependency audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Run tests
        working-directory: backend
        run: npm test

      # The unit suite runs a second time under the coverage reporter because
      # this pass is what enforces the floors in scripts/check-coverage.js.
      - name: Run unit tests with the coverage gate
        working-directory: backend
        run: |
          mkdir -p coverage
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage/summary.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  frontend:
    name: Frontend — tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build (typecheck + bundle)
        working-directory: frontend
        run: npm run build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  sql:
    name: Database — SQL suite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          # The runner reaches MySQL over TCP, not from inside the container, so
          # root has to be reachable from off-host.
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: ticket_booking_test
          MYSQL_USER: tbs_test
          MYSQL_PASSWORD: ci-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: ticket_booking_test
    steps:
      - uses: actions/checkout@v4

      - name: Install the mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      # run-sql-tests.ps1 reads the password from the git-ignored root .env, so
      # the runner writes one rather than the workflow hard-coding the value.
      - name: Stage the runner credentials
        run: echo "DB_PASSWORD=ci-root-password" > .env

      # -Fresh drops and recreates the database from schema.sql first, which is
      # what makes the suite repeatable: 01-seed-data.sql expects an empty schema.
      - name: Recreate the schema and run every SQL suite
        shell: pwsh
        run: ./tests/run-sql-tests.ps1 -Fresh -Database $env:DB_NAME -User $env:DB_USER

  manifests:
    name: Infrastructure — manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        env:
          # Pinned: a new kubeconform release must not silently change the gate.
          KUBECONFORM_VERSION: v0.8.0
        run: |
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      # `kubectl kustomize` renders exactly what
      # `kubectl apply -k infrastructure/kubernetes` would send, so this checks
      # the object set that actually reaches the cluster — namespace, labels and
      # generated ConfigMap content included — not just the raw files.
      - name: Validate the rendered manifests against the Kubernetes schemas
        run: |
          kubectl kustomize infrastructure/kubernetes \
            | kubeconform -strict -summary -kubernetes-version 1.29.0

  docker:
    name: Docker — build & publish
    runs-on: ubuntu-latest
    needs: [backend, frontend, sql, manifests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main) — backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main) — frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
