# Ticket Booking System — throwaway test stack.
#
# Starts the only two services the backend suites need (MySQL 8 + Redis) so a
# fresh clone can run `npm test` without a pre-existing database or cloud
# account. Nothing here is meant for production: the credentials are throwaway
# values and the schema is loaded from infrastructure/database/schema.sql on
# first boot.
#
# Usage (see README "Run the tests locally"):
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && npm ci && npm test
#   docker compose -f docker-compose.test.yml down -v
#
# The host port is 3307, not 3306, so the suite can run while a development
# MySQL is already bound to the default port. Override with MYSQL_TEST_PORT.

name: ticket-booking-test

services:
  mysql:
    image: mysql:8.0
    container_name: tbs-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: test-root-password
      MYSQL_DATABASE: ticket_booking_test
      MYSQL_USER: tbs_test
      MYSQL_PASSWORD: test-db-password
    ports:
      - "${MYSQL_TEST_PORT:-3307}:3306"
    volumes:
      # First-boot initialization: full schema so integration tests have tables.
      - ./infrastructure/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptest-db-password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tbs-test-redis
    # Ephemeral: no volume, no persistence — rate-limit/cache state is disposable.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_TEST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# No named volumes: `docker compose ... down -v` always leaves a clean slate.